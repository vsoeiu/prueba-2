<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feliz 21 de Septiembre - Flores Amarillas</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none; /* Evitar zoom o scroll accidental en móviles */
        }

        body {
            background-color: #010310;
            overflow: hidden;
            font-family: 'Great Vibes', cursive;
            width: 100vw;
            height: 100dvh; /* Adaptable a barras de navegadores móviles */
            position: fixed;
        }

        #sceneCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; 
        }

        #text-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-text {
            position: absolute;
            color: #fff8d6;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.9), 
                         0 0 20px rgba(255, 165, 0, 0.8), 
                         0 0 35px rgba(255, 140, 0, 0.6),
                         2px 2px 5px rgba(0,0,0,1);
            opacity: 0;
            will-change: transform, opacity;
            letter-spacing: 2px;
            /* Evita que se corte en los bordes de celular */
            max-width: 90vw;
            white-space: normal;
            word-wrap: break-word;
        }

        /* Pantalla de inicio para permitir el audio */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: linear-gradient(135deg, #010414 0%, #1a2a6c 100%);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
            transition: opacity 1.5s ease;
        }

        .start-text {
            color: #FFD700;
            font-size: 2.5rem;
            text-align: center;
            padding: 20px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            animation: pulseText 2s infinite;
        }

        @keyframes pulseText {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 30px rgba(255, 215, 0, 1); }
            100% { transform: scale(1); opacity: 0.8; }
        }

        @keyframes floatUpSlow {
            0% {
                transform: translate(-50%, 100vh) scale(0.8);
                opacity: 0;
                filter: blur(3px);
            }
            15% {
                opacity: 1;
                filter: blur(0px);
                transform: translate(-50%, 75vh) scale(1);
            }
            85% {
                opacity: 1;
                filter: blur(0px);
            }
            100% {
                transform: translate(-50%, -20vh) scale(1.1);
                opacity: 0;
                filter: blur(3px);
            }
        }
    </style>
</head>
<body>

    <!-- Pantalla de Bienvenida -->
    <div id="start-overlay">
        <div class="start-text">Toca la pantalla para comenzar la magia...</div>
    </div>

    <!-- Contenedor invisible para YouTube -->
    <div id="player-container" style="display: none;"></div>

    <canvas id="sceneCanvas"></canvas>
    <div id="text-container"></div>

    <!-- API de YouTube -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // --- SISTEMA DE AUDIO DE YOUTUBE ---
        let player;
        let isSceneStarted = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player-container', {
                height: '0',
                width: '0',
                videoId: 'KoFjwzqiJI8', // ID de tu canción
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': 'KoFjwzqiJI8' // Necesario para que el bucle funcione en YouTube
                }
            });
        }

        // Evento de toque para iniciar todo
        document.getElementById('start-overlay').addEventListener('click', function() {
            if (isSceneStarted) return;
            isSceneStarted = true;

            // Reproducir música
            if (player && typeof player.playVideo === 'function') {
                player.playVideo();
            }

            // Ocultar pantalla de bienvenida
            this.style.opacity = '0';
            setTimeout(() => {
                this.style.display = 'none';
            }, 1500);

            // Iniciar Paisaje
            initScene();
            requestAnimationFrame(animate);
            setTimeout(() => {
                spawnText();
                scheduleTexts();
            }, 3000);
        });


        // --- MOTOR DEL PAISAJE ---
        const canvas = document.getElementById('sceneCanvas');
        const ctx = canvas.getContext('2d');
        const textContainer = document.getElementById('text-container');

        let width, height, dpr;
        let time = 0;
        let cycleTime = 0.1; 
        const cycleSpeed = 0.0002; 

        const pSkyTop = ['#010414', '#1a2a6c', '#4CB8C4', '#3c1854', '#010414'];
        const pSkyBot = ['#0a1636', '#fd746c', '#bdf1ff', '#e85d04', '#0a1636'];
        const pMountShadow = ['#060a14', '#1f1315', '#163321', '#1a0e14', '#060a14'];
        const pMountHighlight = ['#131e33', '#8f4f38', '#4b7d3a', '#73313d', '#131e33'];
        const pPineShadow = ['#020805', '#12100d', '#0b2413', '#0f0a0c', '#020805'];
        const pPineHighlight = ['#061a11', '#4a3224', '#265431', '#3b1c24', '#061a11'];
        
        let cachedStars = [];
        let cachedMountains = [];
        let cachedTrees = [];
        let clouds = [];
        let flowers = [];
        let pollenParticles = [];

        const phrases = [
            "Eres mi sol en la noche",
            "Mi flor más hermosa",
            "Brillas en mi oscuridad",
            "Feliz 21 de septiembre",
            "Siempre floreces en mi corazón",
            "Magia en tu sonrisa",
            "Mi paisaje favorito eres tú",
            "Iluminas mis noches",
            "Un amor que nunca se marchita",
            "Mi refugio y mi luz"
        ];

        function hex2rgb(hex) {
            const v = parseInt(hex.replace('#', ''), 16);
            return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
        }
        function rgb2hex(r, g, b) {
            // El .slice(1) y el padStart solucionan el error de los códigos de colores incompletos
            return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1);
        }
        function lerpColor(c1, c2, t) {
            const rgb1 = hex2rgb(c1);
            const rgb2 = hex2rgb(c2);
            const r = Math.round(rgb1[0] + (rgb2[0] - rgb1[0]) * t);
            const g = Math.round(rgb1[1] + (rgb2[1] - rgb1[1]) * t);
            const b = Math.round(rgb1[2] + (rgb2[2] - rgb1[2]) * t);
            return rgb2hex(r, g, b);
        }
        function getColorForTime(t, palette) {
            const stage = (t % 1.0) * 4;
            const idx = Math.floor(stage);
            const fraction = stage - idx;
            if (idx >= 4) return palette[4];
            return lerpColor(palette[idx], palette[idx + 1], fraction);
        }

        function buildGeometry() {
            cachedStars = [];
            for (let i = 0; i < 200; i++) {
                cachedStars.push({
                    x: Math.random() * width,
                    y: Math.random() * (height * 0.7),
                    size: Math.random() * 1.5,
                    brightness: Math.random()
                });
            }

            cachedMountains = [];
            function createRidge(baseY, amplitude, segments) {
                const points = [];
                const faces = [];
                const step = width / segments;
                
                for (let i = 0; i <= segments + 1; i++) {
                    const noise = (Math.sin(i * 1.3) + Math.cos(i * 2.7) + (Math.random() * 2 - 1)) * 0.5;
                    points.push({ x: i * step, y: baseY + noise * amplitude });
                }

                for (let i = 0; i < points.length - 1; i++) {
                    const p1 = points[i];
                    const p2 = points[i + 1];
                    const rockDepth = Math.random() * 60 + 40;
                    
                    const face = {
                        p1: p1,
                        p2: p2,
                        p3: { x: p2.x - rockDepth * 0.5, y: p2.y + rockDepth },
                        p4: { x: p1.x, y: p1.y + rockDepth * 0.8 },
                        isFacingRight: p2.y > p1.y 
                    };
                    faces.push(face);
                }
                cachedMountains.push({ points, faces, baseY });
            }

            createRidge(height * 0.45, 150, 20);
            createRidge(height * 0.60, 100, 14);
            createRidge(height * 0.75, 50, 9);

            cachedTrees = [];
            const numTrees = Math.floor(width / 30);
            for (let i = 0; i < numTrees; i++) {
                const x = Math.random() * width;
                const baseY = height * 0.75 + (Math.sin(x/ (width/10)) * 20) + Math.random() * 40;
                const h = Math.random() * 80 + 60; 
                const w = h * 0.6; 
                const tiers = Math.floor(Math.random() * 2) + 4;
                
                const treeTiers = [];
                for (let t = 0; t < tiers; t++) {
                    const tierYTop = baseY - h + (t * (h / tiers));
                    const tierYBottom = tierYTop + (h / tiers) * 1.6;
                    const tierWidth = w * ((t + 1) / tiers);
                    treeTiers.push({ yTop: tierYTop, yBot: tierYBottom, w: tierWidth });
                }
                cachedTrees.push({ x, y: baseY, h, w, tiers: treeTiers });
            }
        }

        class Cloud {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * (height * 0.4); 
                this.speed = Math.random() * 0.2 + 0.05;
                this.scale = Math.random() * 0.8 + 0.4;
            }
            update() {
                this.x += this.speed;
                if (this.x > width + 400) {
                    this.x = -400;
                    this.y = Math.random() * (height * 0.4);
                }
            }
            draw(cloudColor) {
                ctx.save();
                ctx.globalAlpha = 0.12; 
                ctx.translate(this.x, this.y);
                ctx.scale(this.scale, this.scale);
                ctx.fillStyle = cloudColor;
                ctx.shadowColor = cloudColor;
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(40, -40, 100, -50, 150, -10);
                ctx.bezierCurveTo(200, -40, 280, -30, 320, 10);
                ctx.bezierCurveTo(380, 10, 400, 40, 350, 50);
                ctx.bezierCurveTo(250, 60, 120, 60, 20, 40);
                ctx.bezierCurveTo(-20, 30, -30, 0, 0, 0);
                ctx.fill();
                ctx.restore();
            }
        }

        class Pollen {
            constructor() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 100;
                this.size = Math.random() * 2 + 1;
                this.vy = -(Math.random() * 0.4 + 0.1); 
                this.vx = (Math.random() - 0.5) * 0.5;
                this.phase = Math.random() * Math.PI * 2;
            }
            update() {
                this.y += this.vy;
                this.x += this.vx + Math.sin(time * 0.5 + this.phase) * 0.5;
                if (this.y < -50) {
                    this.y = height + 10;
                    this.x = Math.random() * width;
                }
            }
            draw(isNight) {
                ctx.save();
                const baseOpacity = isNight ? 0.8 : 0.3;
                ctx.globalAlpha = Math.max(0, Math.min(1, baseOpacity + Math.sin(time * 2 + this.phase) * 0.5));
                ctx.fillStyle = isNight ? '#FFF5B8' : '#FFD700';
                ctx.shadowColor = isNight ? '#FFD700' : 'transparent';
                ctx.shadowBlur = isNight ? 15 : 0;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Flower {
            constructor() {
                this.x = Math.random() * width;
                const depth = Math.pow(Math.random(), 1.5); 
                this.baseY = height * 0.85 + (1 - depth) * (height * 0.15); 
                this.size = (1 - depth) * 20 + 10; 
                this.color = Math.random() > 0.3 ? '#FFD700' : '#FFA500';
                this.swayOffset = Math.random() * Math.PI * 2;
                this.swaySpeed = Math.random() * 0.8 + 0.5;
            }
            draw(isNight) {
                const swayAmount = Math.sin(time * this.swaySpeed + this.swayOffset) * (this.size * 1.2);
                const currentX = this.x + swayAmount;
                
                ctx.save();
                ctx.beginPath();
                ctx.strokeStyle = isNight ? '#0a2412' : '#1b5e20'; 
                ctx.lineWidth = this.size * 0.25;
                ctx.moveTo(currentX, this.baseY - this.size * 2);
                ctx.quadraticCurveTo(this.x, this.baseY, this.x, height + 100);
                ctx.stroke();

                ctx.translate(currentX, this.baseY - this.size * 2);
                ctx.fillStyle = this.color;
                
                if(isNight) {
                    ctx.shadowColor = '#FFB300';
                    ctx.shadowBlur = this.size * 1.5; 
                }

                for (let i = 0; i < 5; i++) {
                    const angle = (i * Math.PI * 2) / 5;
                    const px = Math.cos(angle) * this.size;
                    const py = Math.sin(angle) * this.size;
                    ctx.beginPath();
                    ctx.arc(px, py, this.size * 0.75, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = isNight ? '#2a1202' : '#3e1d04';
                ctx.beginPath();
                ctx.arc(0, 0, this.size * 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function spawnText() {
            const text = phrases[Math.floor(Math.random() * phrases.length)];
            const textEl = document.createElement('div');
            textEl.classList.add('floating-text');
            textEl.textContent = text;
            
            // Posición horizontal (10% al 90% para que no toquen los bordes)
            const randomLeft = Math.random() * 80 + 10;
            textEl.style.left = `${randomLeft}%`; 

            // Tamaños variados adaptables a celular y PC
            const isMobile = window.innerWidth <= 768;
            const minSize = isMobile ? 1.4 : 2.0;
            const maxSize = isMobile ? 2.2 : 3.5;
            textEl.style.fontSize = `${Math.random() * (maxSize - minSize) + minSize}rem`;

            const duration = 25 + Math.random() * 10;
            textEl.style.animation = `floatUpSlow ${duration}s cubic-bezier(0.25, 0.1, 0.25, 1) forwards`;
            
            textContainer.appendChild(textEl);
            textEl.addEventListener('animationend', () => textEl.remove());
        }

        function scheduleTexts() {
            const delay = 6000 + Math.random() * 4000; 
            setTimeout(() => {
                spawnText();
                scheduleTexts();
            }, delay);
        }

        function drawScene() {
            cycleTime += cycleSpeed;
            if (cycleTime > 1) cycleTime -= 1;
            
            const isNight = cycleTime < 0.2 || cycleTime > 0.8;
            const skyTop = getColorForTime(cycleTime, pSkyTop);
            const skyBot = getColorForTime(cycleTime, pSkyBot);
            const mountShad = getColorForTime(cycleTime, pMountShadow);
            const mountHigh = getColorForTime(cycleTime, pMountHighlight);
            const pineShad = getColorForTime(cycleTime, pPineShadow);
            const pineHigh = getColorForTime(cycleTime, pPineHighlight);

            let gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, skyTop);
            gradient.addColorStop(1, skyBot);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            let starOpacity = 1;
            if (cycleTime > 0.15 && cycleTime <= 0.25) starOpacity = 1 - ((cycleTime - 0.15) * 10);
            else if (cycleTime > 0.25 && cycleTime < 0.75) starOpacity = 0;
            else if (cycleTime >= 0.75 && cycleTime < 0.85) starOpacity = (cycleTime - 0.75) * 10;

            if (starOpacity > 0) {
                ctx.save();
                cachedStars.forEach(s => {
                    const twinkle = Math.sin(time * 3 + s.brightness * 10) * 0.5 + 0.5;
                    ctx.fillStyle = `rgba(255, 255, 255, ${s.brightness * starOpacity * twinkle})`;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.restore();
            }

            const sunAngle = (cycleTime * Math.PI * 2) - Math.PI/2; 
            const moonAngle = sunAngle + Math.PI;
            
            const getOrbitPos = (angle) => {
                const cx = width / 2;
                const cy = height * 0.8; 
                const r = Math.min(width, height) * 0.6;
                return {
                    x: cx + Math.cos(angle) * r,
                    y: cy + Math.sin(angle) * r * 0.7
                };
            };

            const sunPos = getOrbitPos(sunAngle);
            const moonPos = getOrbitPos(moonAngle);

            if (sunPos.y < height + 100) {
                ctx.save();
                ctx.fillStyle = '#FFFDE7';
                ctx.shadowColor = '#FFB300';
                ctx.shadowBlur = 100;
                ctx.beginPath();
                ctx.arc(sunPos.x, sunPos.y, Math.min(width, height) * 0.08, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            if (moonPos.y < height + 100) {
                ctx.save();
                ctx.fillStyle = '#f0f4f8';
                ctx.shadowColor = '#bdf1ff';
                ctx.shadowBlur = 80;
                ctx.beginPath();
                ctx.arc(moonPos.x, moonPos.y, Math.min(width, height) * 0.06, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            let lightX = (cycleTime > 0.25 && cycleTime < 0.75) ? sunPos.x : moonPos.x;

            const cloudColor = isNight ? '#1a2744' : '#ffffff';
            clouds.forEach(c => { c.update(); c.draw(cloudColor); });

            cachedMountains.forEach(layer => {
                ctx.fillStyle = mountShad;
                ctx.beginPath();
                ctx.moveTo(0, height);
                layer.points.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.lineTo(width, height);
                ctx.fill();

                layer.faces.forEach(face => {
                    const faceCenterX = (face.p1.x + face.p2.x) / 2;
                    const lightFromRight = lightX > faceCenterX;
                    
                    if (face.isFacingRight === lightFromRight) {
                        ctx.fillStyle = mountHigh;
                        ctx.beginPath();
                        ctx.moveTo(face.p1.x, face.p1.y);
                        ctx.lineTo(face.p2.x, face.p2.y);
                        ctx.lineTo(face.p3.x, face.p3.y);
                        ctx.lineTo(face.p4.x, face.p4.y);
                        ctx.fill();
                    }
                });
            });

            cachedTrees.forEach(tree => {
                const lightFromRight = lightX > tree.x;

                ctx.fillStyle = '#050302'; 
                ctx.fillRect(tree.x - tree.w*0.05, tree.y - tree.h, tree.w*0.1, tree.h);

                tree.tiers.forEach(tier => {
                    ctx.fillStyle = lightFromRight ? pineShad : pineHigh;
                    ctx.beginPath();
                    ctx.moveTo(tree.x, tier.yTop);
                    ctx.lineTo(tree.x - tier.w*0.5, tier.yBot);
                    ctx.lineTo(tree.x - tier.w*0.2, tier.yBot - tree.h*0.05);
                    ctx.lineTo(tree.x, tier.yBot);
                    ctx.fill();

                    ctx.fillStyle = lightFromRight ? pineHigh : pineShad;
                    ctx.beginPath();
                    ctx.moveTo(tree.x, tier.yTop);
                    ctx.lineTo(tree.x + tier.w*0.5, tier.yBot);
                    ctx.lineTo(tree.x + tier.w*0.2, tier.yBot - tree.h*0.05);
                    ctx.lineTo(tree.x, tier.yBot);
                    ctx.fill();
                });
            });

            flowers.forEach(f => f.draw(isNight));
            pollenParticles.forEach(p => { p.update(); p.draw(isNight); });
        }

        let resizeTimer;
        function initScene() {
            dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            buildGeometry();
            
            clouds = [];
            flowers = [];
            pollenParticles = [];
            
            for (let i = 0; i < 8; i++) clouds.push(new Cloud());
            
            const flowerCount = Math.floor(width / 5); 
            for (let i = 0; i < flowerCount; i++) flowers.push(new Flower());
            flowers.sort((a, b) => a.baseY - b.baseY); 

            for (let i = 0; i < 80; i++) pollenParticles.push(new Pollen());
        }

        window.addEventListener('resize', () => {
            if(!isSceneStarted) return;
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(initScene, 200); 
        });

        function animate(timestamp) {
            time = timestamp * 0.001; 
            ctx.clearRect(0, 0, width, height);
            drawScene();
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
